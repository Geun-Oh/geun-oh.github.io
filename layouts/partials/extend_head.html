<link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
<meta name="naver-site-verification" content="bf27bf254df8727acd06d8dca086cae816179a0b" />
{{- with .Page -}}
{{- $hasMermaidFence := and .IsPage (gt (len (findRE "(?m)^```mermaid(?:\\s|$)" .RawContent)) 0) -}}
{{- if or (.Store.Get "hasMermaid") $hasMermaidFence -}}
<script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
        startOnLoad: true
    });
</script>
{{- end -}}
{{- end -}}
